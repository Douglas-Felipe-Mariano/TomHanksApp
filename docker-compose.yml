services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "${RESERVED_PORT:-3000}:3000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - LOG_SERVICE_URL=http://log-service:3002
      - PORT=3000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=profiles
      - MINIO_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost}:9000
    restart: unless-stopped
    depends_on:
      - auth-service
      - log-service
      - minio

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - RESET_TOKEN_MINUTES=${RESET_TOKEN_MINUTES:-30}
      - LOG_SERVICE_URL=http://log-service:3002
      - PORT=3001
    restart: unless-stopped
    depends_on:
      - log-service

  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3002
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/bitnami/minio/data
    restart: unless-stopped

volumes:
  minio_data:
