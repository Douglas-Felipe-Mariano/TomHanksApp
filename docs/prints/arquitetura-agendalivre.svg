  <rect x="910" y="158" width="220" height="48" class="box-green"/>
  <text x="1020" y="188" text-anchor="middle" class="box-title">Servidor SMTP</text>

  <rect x="40" y="252" width="820" height="418" rx="18" class="lane"/>
