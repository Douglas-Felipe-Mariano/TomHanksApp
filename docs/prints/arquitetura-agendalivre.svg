    <marker id="arrowMint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4b9b78"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#282a38}.title{font-size:29px;font-weight:700}.subtitle{font-size:16px;fill:#707486}.lane{fill:#fff;stroke:#e6e3f2;stroke-width:2}.external{fill:#f2efff;stroke:#e6e3f2;stroke-width:2}.lane-title{font-size:17px;font-weight:700;letter-spacing:1px;fill:#7060d7}.box{fill:#fff;stroke:#7060d7;stroke-width:2;rx:16}.box-green{fill:#f1faf5;stroke:#70b894;stroke-width:2;rx:16}.box-purple{fill:#f5f3ff;stroke:#7060d7;stroke-width:2;rx:16}.box-title{font-size:19px;font-weight:700}.box-sub{font-size:15px;fill:#737789}.edge{fill:none;stroke:#7060d7;stroke-width:3;marker-end:url(#arrow)}.edge-green{fill:none;stroke:#4b9b78;stroke-width:3;marker-end:url(#arrowMint)}.edge-dash{stroke-dasharray:9 7}.label-bg{fill:#fff;stroke:#e6e3f2;stroke-width:1;rx:7}.label{font-size:14px;fill:#5145a6;font-weight:700}.note{font-size:14px;fill:#707486}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#faf9ff"/>
  <text x="48" y="54" class="title">AgendaLivre · arquitetura descrita pelo repositório</text>
