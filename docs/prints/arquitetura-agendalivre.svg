  <rect x="720" y="520" width="200" height="82" class="box-green"/>
  <text x="820" y="554" text-anchor="middle" class="box-title">MinIO</text>
  <text x="820" y="581" text-anchor="middle" class="box-sub">logos públicos</text>

  <path d="M510 440 V500 H360 V520" class="edge"/>
